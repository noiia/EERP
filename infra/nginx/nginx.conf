limit_req_zone $binary_remote_addr zone=gateway_req:10m rate=20r/s;
limit_conn_zone $binary_remote_addr zone=gateway_conn:10m;

server {
    listen 80;
    http2 on;
    server_name _;

    # Matches API_MAX_BODY_SIZE in .env — keep the two in sync.
    client_max_body_size 50m;
    resolver 127.0.0.11 valid=10s;

    # Baseline security headers (defense-in-depth on top of the headers the Go
    # API and Next.js already set on their own responses).
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    limit_conn gateway_conn 20;

    location = /healthz {
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }

    set $api_upstream http://core-back:8080;
    set $frontend_upstream http://core-front:3000;

    location = /health {
        limit_req zone=gateway_req burst=40 nodelay;
        proxy_pass $api_upstream/health;
        proxy_set_header Host $host;
    }

    # /api/v1/auth/* LOOKS like Go's versioned REST surface but isn't — it's the
    # frontend's own BFF login/logout/refresh routes, published at a versioned path
    # (kept in sync with backend_version) and rewritten by next.config.mjs back to the
    # real /api/auth/* route handler that sets the HttpOnly session cookie. That
    # rewrite only happens if this hits the frontend, so this location must stay more
    # specific than — and therefore win prefix-matching over — the general /api/v1/
    # one below; sending it to Go instead would return raw tokens with no cookie ever
    # set on the Next domain.
    location /api/v1/auth/ {
        limit_req zone=gateway_req burst=40 nodelay;
        proxy_pass $frontend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # The Go backend's OWN versioned REST surface.
    location /api/v1/ {
        limit_req zone=gateway_req burst=40 nodelay;
        proxy_pass $api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    location / {
        limit_req zone=gateway_req burst=40 nodelay;
        proxy_pass $frontend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

