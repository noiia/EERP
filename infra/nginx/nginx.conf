limit_req_zone $binary_remote_addr zone=gateway_req:10m rate=20r/s;
limit_conn_zone $binary_remote_addr zone=gateway_conn:10m;

# Plain HTTP: healthcheck only, everything else upgrades to TLS+HTTP/2 below.
# A Secure session cookie (core-front's session-cookies.ts, Secure by default
# once COOKIE_SECURE's override is dropped — see compose.yml) is silently
# dropped by the browser over plain HTTP, so serving the app here directly
# would look like it works but never actually persist a login. Kept as its
# own listener (rather than folded into :443) so the compose healthcheck
# (`wget http://127.0.0.1/healthz`) and any plain-HTTP client don't need TLS
# just to learn the gateway is up.
server {
    listen 80;
    server_name _;

    location = /healthz {
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ─── HTTPS: TLS termination + HTTP/2, reverse proxy to api/frontend ─────────
# This is the ONLY place HTTP/2 exists in the stack — browsers never speak h2
# without TLS (no h2c support: verified empirically, Node's undici fetch
# silently stays on HTTP/1.1 against a cleartext h2c server even with an
# allowH2 dispatcher). Next<->Go stays plain HTTP/1.1 internally (ApiClient.ts,
# untouched) since that's a low-latency single-service call, not the many-
# parallel-requests-from-a-real-client case HTTP/2 actually helps with. The
# cert is generated by the `gateway-certs` one-shot compose service
# (infra/nginx/gen-certs.sh) into a shared volume BEFORE nginx starts — never
# committed (*.crt/*.key are gitignored), self-signed, dev/internal use only.
# Swap in a real cert here for a public-facing deployment.
server {
    listen 443 ssl;
    http2 on;
    server_name _;

    ssl_certificate     /etc/nginx/certs/gateway.crt;
    ssl_certificate_key /etc/nginx/certs/gateway.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;

    # Matches API_MAX_BODY_SIZE in .env — keep the two in sync.
    client_max_body_size 50m;
    resolver 127.0.0.11 valid=10s;

    # Baseline security headers (defense-in-depth on top of the headers the Go
    # API and Next.js already set on their own responses).
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    limit_conn gateway_conn 20;

    location = /healthz {
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }

    set $api_upstream http://core-back:8080;
    set $frontend_upstream http://core-front:3000;

    location = /health {
        limit_req zone=gateway_req burst=40 nodelay;
        proxy_pass $api_upstream/health;
        proxy_set_header Host $host;
    }

    # Same routing as the :80 server block above — see its own comment on why
    # /api/v1/auth/ must stay more specific than /api/v1/.
    location /api/v1/auth/ {
        limit_req zone=gateway_req burst=40 nodelay;
        proxy_pass $frontend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/v1/ {
        limit_req zone=gateway_req burst=40 nodelay;
        proxy_pass $api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    location / {
        limit_req zone=gateway_req burst=40 nodelay;
        proxy_pass $frontend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
