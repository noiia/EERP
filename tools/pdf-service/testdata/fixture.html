<!doctype html>
<html>
<head><meta charset="utf-8"><style>
body { font-family: sans-serif; }
.page-break { page-break-before: always; }
</style></head>
<body>
<h1>Fixture report</h1>
<!-- Mirrors core-front's print route: a Server Component whose HTML already
     carries the ready marker, no client JS needed. -->
<p data-report-ready>ready</p>
<div class="page-break">Second page content</div>
<script>
  // The renderer disables page JavaScript. If this ever runs, it collapses
  // the report to one page, which the renderer tests catch.
  document.body.innerHTML = '<p data-report-ready>JS ran</p>';
</script>
</body>
</html>
