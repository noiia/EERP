name: Security scan

# Layered security CI: dependency CVEs, Go SAST, secrets/misconfig, CodeQL,
# and a dynamic OWASP ZAP baseline "pen test" against the running backend.
#
# Philosophy: REPORT-ONLY. No job fails the build on findings — results are
# pushed to the GitHub "Security" tab (SARIF) or uploaded as artifacts so they
# can be triaged. Flip any `exit-code`/`|| true`/`continue-on-error` to enforce
# later, once the backlog is clean.

on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches: [main, dev]
  schedule:
    # Weekly — catches newly disclosed CVEs in unchanged dependencies.
    - cron: "0 6 * * 1"
  workflow_dispatch:

# Least-privilege defaults; jobs that upload SARIF widen this locally.
permissions:
  contents: read

jobs:
  # ── Dependency CVEs (backend go.mod + frontend package-lock.json) ───────────
  dependency-scan:
    name: Dependency CVEs (OSV)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v6
        with:
          go-version: "1.26"
      - name: Install osv-scanner
        run: go install github.com/google/osv-scanner/cmd/osv-scanner@latest
      - name: Scan all lockfiles (go.sum, package-lock.json)
        # osv-scanner walks the repo and scans every lockfile it finds.
        # exits non-zero when vulns exist — keep the workflow green here.
        run: osv-scanner scan --format sarif --output osv.sarif -r . || true
      - name: Upload OSV results (Security tab)
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        continue-on-error: true # needs GitHub Advanced Security on private repos
        with:
          sarif_file: osv.sarif
          category: osv-scanner
      - name: Upload OSV report (artifact)
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: osv-sarif
          path: osv.sarif

  # ── Go static analysis + Go vulnerability database ──────────────────────────
  go-sast:
    name: Go SAST (gosec + govulncheck)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    defaults:
      run:
        working-directory: core
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v6
        with:
          go-version: "1.26"
      - name: Install tools
        run: |
          go install github.com/securego/gosec/v2/cmd/gosec@latest
          go install golang.org/x/vuln/cmd/govulncheck@latest
      - name: gosec (SAST → SARIF)
        # -no-fail: never exit non-zero; we report, not gate.
        run: gosec -no-fail -fmt sarif -out ../gosec.sarif ./...
      - name: govulncheck (human-readable log)
        run: govulncheck ./... || true
      - name: govulncheck (SARIF)
        run: govulncheck -format sarif ./... > ../govulncheck.sarif || true
      - name: Upload gosec results (Security tab)
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        continue-on-error: true # needs GitHub Advanced Security on private repos
        with:
          sarif_file: gosec.sarif
          category: gosec
      - name: Upload govulncheck results (Security tab)
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        continue-on-error: true # needs GitHub Advanced Security on private repos
        with:
          sarif_file: govulncheck.sarif
          category: govulncheck
      - name: Upload Go SAST reports (artifact)
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: go-sast-sarif
          path: |
            gosec.sarif
            govulncheck.sarif

  # ── Secrets, misconfig, Dockerfile, OS/lib CVEs (whole tree) ────────────────
  code-and-secret-scan:
    name: Trivy (secrets + misconfig + vuln)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4
      - name: Install Trivy
        run: |
          curl -sfL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh \
            | sh -s -- -b /usr/local/bin
      - name: Trivy filesystem scan (→ SARIF)
        # --exit-code 0 keeps it report-only; scanners cover the main attack surface.
        run: |
          trivy fs \
            --scanners vuln,secret,misconfig \
            --format sarif \
            --output trivy.sarif \
            --exit-code 0 \
            .
      - name: Upload Trivy results (Security tab)
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        continue-on-error: true # needs GitHub Advanced Security on private repos
        with:
          sarif_file: trivy.sarif
          category: trivy
      - name: Upload Trivy report (artifact)
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: trivy-sarif
          path: trivy.sarif

  # ── CodeQL: deep SAST for Go and TS (injection, XSS, path traversal, …) ─────
  codeql:
    name: CodeQL (${{ matrix.language }})
    runs-on: ubuntu-latest
    # Never block on a build hiccup — report-only.
    continue-on-error: true
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: go
            build-mode: manual
          - language: javascript-typescript
            build-mode: none
    steps:
      - uses: actions/checkout@v4
      - name: Set up Go
        if: matrix.language == 'go'
        uses: actions/setup-go@v6
        with:
          go-version: "1.26"
      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
      - name: Manual build (Go)
        if: matrix.build-mode == 'manual'
        run: cd core && go build ./...
      - name: Analyze
        uses: github/codeql-action/analyze@v3
        with:
          category: "/language:${{ matrix.language }}"

  # ── Dynamic pen test: OWASP ZAP baseline against the running backend ────────
  # Heavy (builds + boots the stack), so it runs on main/dev pushes, the weekly
  # schedule, and manual dispatch — not on every PR.
  dast-zap:
    name: DAST (OWASP ZAP baseline)
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request'
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Build & start the stack
        run: docker compose up -d --build

      - name: Wait for backend on :8080
        run: |
          echo "Waiting for http://localhost:8080 ..."
          for i in $(seq 1 60); do
            if curl -sS -o /dev/null http://localhost:8080/; then
              echo "Backend is responding."
              exit 0
            fi
            sleep 5
          done
          echo "::warning::Backend did not come up in time — dumping logs."
          docker compose logs --no-color || true
          exit 1

      - name: ZAP baseline scan
        # Passive spider + known-issue checks (headers, CORS, cookies, etc.).
        # -I = don't fail on warnings; `|| true` = never gate the build.
        run: |
          mkdir -p zap-out && chmod 777 zap-out
          docker run --rm --network host \
            -v "$(pwd)/zap-out:/zap/wrk:rw" \
            ghcr.io/zaproxy/zaproxy:stable \
            zap-baseline.py \
              -t http://localhost:8080 \
              -r zap-report.html \
              -w zap-report.md \
              -J zap-report.json \
              -I || true

      - name: Upload ZAP report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: zap-baseline-report
          path: zap-out/

      - name: Tear down
        if: always()
        run: docker compose down -v || true
