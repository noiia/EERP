name: Upgrade tool

# tools/eerp-upgrade has its own workflow, deliberately not part of test-check.yml /
# test-build.yml: a red run here never blocks the front, back or pdf-service image builds.
# A schema change elsewhere does not trigger it, so whoever renames, drops or retypes a
# column runs `make test-upgrade` (or dispatches this workflow) in that change.
on:
  push:
    paths:
      - 'tools/eerp-upgrade/**'
      - '.github/workflows/upgrade-tool.yml'
  pull_request:
    paths:
      - 'tools/eerp-upgrade/**'
      - '.github/workflows/upgrade-tool.yml'
  workflow_dispatch:

jobs:
  upgrade-tool-test:
    timeout-minutes: 45
    concurrency:
      group: upgrade-tool-${{ github.ref }}
      cancel-in-progress: true
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgis/postgis:18-3.7
        env:
          POSTGRES_PASSWORD: ci_test_password
          POSTGRES_DB: poc
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -h 127.0.0.1 -U postgres -d poc"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v6
        with:
          # Tags: the -to test checks a past release out in a git worktree.
          fetch-depth: 0
      - uses: actions/setup-go@v6
        with:
          go-version-file: tools/eerp-upgrade/go.mod
          cache-dependency-path: tools/eerp-upgrade/go.sum
      - name: install the PostgreSQL 18 client tools
        # pg_dump/pg_restore must match the server's major version.
        run: |
          sudo apt-get install -y postgresql-common
          sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y
          sudo apt-get install -y postgresql-client-18
          echo /usr/lib/postgresql/18/bin >> "$GITHUB_PATH"
      - name: create the test config
        # eerp-config.json is gitignored: build it from the template, with the
        # service's database coordinates and throwaway secrets.
        run: |
          cp eerp-config.example.json eerp-config.json
          secret=$(openssl rand -hex 32)
          sed -i -E "s/(\"(master_key|s3_access_key|s3_secret_key)\"[[:space:]]*:[[:space:]]*\")[^\"]*\"/\1$secret\"/" eerp-config.json
          sed -i -E 's/("db_password"[[:space:]]*:[[:space:]]*")[^"]*"/\1ci_test_password"/' eerp-config.json
      - name: test the upgrade tool
        run: cd tools/eerp-upgrade && CONFIG=$PWD/../../eerp-config.json EERP_UPGRADE_SLOW=1 go test ./... -timeout 30m
