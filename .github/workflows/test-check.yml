name: Test check

# Runs on every PR for fast feedback, and is reusable (workflow_call) so the
# Test & Build pipeline (test-build.yml) can gate the Docker builds on the same
# checks without duplicating them.
on:
  workflow_call:

jobs:
    core-test-and-coverage:
        runs-on: ubuntu-latest
        services:
            postgres:
                image: postgres:18
                env:
                    POSTGRES_PASSWORD: ci_test_password
                    POSTGRES_DB: poc
                ports:
                    - 5432:5432
                # TCP check: a socket pg_isready passes during initdb's temporary server.
                options: >-
                    --health-cmd "pg_isready -h 127.0.0.1 -U postgres -d poc"
                    --health-interval 5s --health-timeout 5s --health-retries 10
        steps:
          - uses: actions/checkout@v6
          - uses: actions/setup-go@v6
            with:
              go-version: '1.26'
              # go.mod lives in core/, not the repo root — point the build cache at it.
              cache-dependency-path: core/go.sum
          - name: test code and generate coverage report
            # TEST_DSN is what makes the DB-backed tests run (core/internal/testdb) —
            # without it they skip. The database is the job's `postgres` service
            # below: compose.yml's db only `expose`s 5432 (no host port), so it isn't
            # reachable from the runner.
            env:
              TEST_DSN: postgres://postgres:ci_test_password@localhost:5432/poc
            run: cd ./core/ && go test ./... -coverprofile=./cover.out -covermode=atomic -coverpkg=./...

          - name: dead code gate
            # Fails on any function unreachable from main that isn't deliberate public
            # API listed in .github/deadcode-allowlist.txt.
            run: |
              go install golang.org/x/tools/cmd/deadcode@v0.50.0
              cd ./core/
              deadcode -f '{{range .Funcs}}{{$.Path}}.{{.Name}}{{"\n"}}{{end}}' ./... | sort > /tmp/dead.txt
              sed '/^#/d' ../.github/deadcode-allowlist.txt | sort | comm -23 /tmp/dead.txt - | tee /tmp/new-dead.txt
              test ! -s /tmp/new-dead.txt

          - name: analyse coverage
            uses: vladopajic/go-test-coverage@v2
            with:
                config: .github/.testcoverage.yml

    pdf-service-test-and-coverage:
        runs-on: ubuntu-latest
        steps:
          - uses: actions/checkout@v6
          - uses: actions/setup-go@v6
            with:
              go-version: '1.26'
              # go.mod lives in tools/pdf-service/, not the repo root — point the
              # build cache at it (a separate Go module from core/).
              cache-dependency-path: tools/pdf-service/go.sum
          - name: test code and generate coverage report
            run: cd ./tools/pdf-service/ && go test ./... -coverprofile=./cover.out -covermode=atomic -coverpkg=./...

          - name: analyse coverage
            uses: vladopajic/go-test-coverage@v2
            with:
                config: .github/.testcoverage-pdf-service.yml

    core-front-test-and-coverage:
        runs-on: ubuntu-latest
        defaults:
          run:
            working-directory: ./core-front
        steps:
          - uses: actions/checkout@v6
          - uses: pnpm/action-setup@v4
            with:
              version: 12.4.2
          - uses: actions/setup-node@v6
            with:
              # Node 24+ exposes a built-in Web Storage `localStorage` global that is
              # non-functional without --localstorage-file and shadows jsdom's working
              # one, breaking zustand's persist middleware under vitest. The test runner
              # is independent of the production image (node:26), so pin it to 22 LTS.
              node-version: '22'
              cache: pnpm
              cache-dependency-path: core-front/pnpm-lock.yaml
          - name: install dependencies
            run: pnpm install --frozen-lockfile
          - name: build engine package
            # The shell app and the external modules import @eerp/core-front via its
            # built dist/ (types + js). A fresh checkout has no dist/, so typecheck and
            # tests can't resolve it — build the engine first.
            run: pnpm --filter @eerp/core-front build
          - name: lint
            run: pnpm lint
          - name: typecheck
            run: pnpm typecheck
          - name: test code and generate coverage report
            # vitest (v8 provider) runs the analysis itself — the frontend analog of
            # the backend's go-test-coverage step. lcov is emitted for tooling.
            run: pnpm test:coverage
          - name: upload coverage report
            if: always()
            uses: actions/upload-artifact@v4
            with:
              name: core-front-coverage
              path: |
                core-front/apps/shell/coverage/lcov.info
                core-front/packages/core-front/coverage/lcov.info
              if-no-files-found: ignore
