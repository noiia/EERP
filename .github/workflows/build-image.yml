name: Build service image

# Reusable workflow ONLY — test-build.yml calls it once per service listed in
# .github/services.json whose code changed (a matrix). It builds that service's
# Docker image and publishes it to the GitHub Container Registry (ghcr.io).
#
# Every image is built from the repo root (context `.`), so a Dockerfile can COPY
# anything it needs (the frontend reads module views under core/modules), and gets
# two build args — EERP_VERSION (the build's version, stamped into the service so
# Settings can show it) and API_BASE (the frontend's BFF -> Go origin). A
# Dockerfile ignores the args it doesn't declare.
on:
  workflow_call:
    inputs:
      # The image name under ghcr.io/<owner>/ (services.json `image`).
      image:
        description: "Image name, e.g. eerp-core"
        required: true
        type: string
      # Path of the service's Dockerfile from the repo root (services.json `dockerfile`).
      dockerfile:
        description: "Dockerfile path, e.g. core/Dockerfile"
        required: true
        type: string
      # Extra tag applied to the published image.
      image_tag:
        description: "Tag applied to the published image (e.g. 'latest')"
        required: false
        type: string
        default: latest
      # The build's version, computed by test-build.yml's `version` job: pushed as an
      # image tag and baked into the build (EERP_VERSION). Empty = untagged build.
      version:
        description: "Build version (e.g. 0.101.0)"
        required: false
        type: string
        default: ""
      # Selects the GitHub deployment Environment whose variables/secrets back the
      # build (configured under Settings -> Environments).
      environment:
        description: "GitHub Environment whose variables/secrets to use for the build"
        required: false
        type: string
        default: build
    outputs:
      image:
        description: "Fully-qualified image reference(s) that were pushed"
        value: ${{ jobs.build.outputs.image }}

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    # Binds the GitHub Environment so its `vars` and `secrets` are in scope below.
    environment: ${{ inputs.environment }}
    outputs:
      image: ${{ steps.meta.outputs.tags }}
    steps:
      - uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          # ghcr requires a lowercase path; repository_owner is already lowercase here.
          images: ghcr.io/${{ github.repository_owner }}/${{ inputs.image }}
          tags: |
            type=raw,value=${{ inputs.image_tag }}
            type=raw,value=${{ inputs.version }},enable=${{ inputs.version != '' }}
            type=sha

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ inputs.dockerfile }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # API_BASE comes from the selected GitHub Environment's variables, with a
          # sane in-cluster default mirroring compose.yml.
          build-args: |
            EERP_VERSION=${{ inputs.version || 'dev' }}
            API_BASE=${{ vars.API_BASE || 'http://backend:8080' }}
          # One cache scope per image, so services don't evict each other's layers.
          cache-from: type=gha,scope=${{ inputs.image }}
          cache-to: type=gha,mode=max,scope=${{ inputs.image }}
