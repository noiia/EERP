name: Test & Build

# Top-level pipeline: run the test + coverage checks, then (only if they pass)
# build and publish whichever Docker image(s) actually changed to ghcr.io —
# each image only rebuilds when the code it's actually built FROM changed
# since the last push (the `changes` job below), so an unrelated change
# (e.g. only core-front/ touched) never produces a redundant, identical
# core/pdf-service image.
#
# It is the "summary" workflow wiring the reusable pieces together:
#   - test-check.yml         (Go + frontend tests and coverage — always runs)
#   - build-core.yml         (backend image -> ghcr, only if `core` changed)
#   - build-core-front.yml   (frontend image -> ghcr, only if `core_front` changed)
#   - build-pdf-service.yml  (PDF worker image -> ghcr, only if `pdf_service` changed)
#   - the `version` job below numbers each build (0.101.0, 0.102.0, …) for all three
# `workflow_dispatch` always builds all three regardless of what changed —
# an explicit manual trigger is itself the "I want an image" signal.
on:
  push:
    branches: [main, dev]
  pull_request:
    types: [opened, edited, synchronize, reopened]
  workflow_dispatch:
    inputs:
      image_tag:
        description: "Tag applied to the published images"
        required: false
        type: string
        default: latest
      environment:
        description: "GitHub Environment whose variables/secrets back the build"
        required: false
        type: string
        default: build

permissions:
  contents: read
  packages: write

jobs:
  # 0. Which image(s) actually need rebuilding — compares against the base of
  # the push/PR. dorny/paths-filter resolves that via the GitHub API (no
  # checkout needed) only for `pull_request` events; a `push` event needs a
  # real local git history to diff against the base commit, so this job
  # checks out first (fetch-depth: 0 — cheap for this repo's size, and avoids
  # paths-filter failing to find the base commit in a shallow clone). Filter/
  # output names are kept hyphen-free (`core_front`/`pdf_service`) since
  # GitHub Actions expression dot-notation can't address a hyphenated
  # property name. `core_front` also reacts to `core/modules/**` and the root
  # `eerp-config.json`: the frontend image's own build (core-front/
  # Dockerfile's "modules" stage) copies each module's views/reports/i18n
  # files and reads eerp-config.json to discover them — a module's frontend
  # contribution is genuinely part of that image even though it lives under
  # core/.
  changes:
    runs-on: ubuntu-latest
    outputs:
      core: ${{ steps.filter.outputs.core }}
      core_front: ${{ steps.filter.outputs.core_front }}
      pdf_service: ${{ steps.filter.outputs.pdf_service }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            core:
              - 'core/**'
            core_front:
              - 'core-front/**'
              - 'core/modules/**'
              - 'eerp-config.json'
            pdf_service:
              - 'tools/pdf-service/**'

  # 1. Gate: reuse the exact same checks PRs run.
  test:
    uses: ./.github/workflows/test-check.yml

  # 1b. Version of this build (.github/scripts/next-version.sh): the latest vX.Y.Z
  # tag with its minor bumped, 0.101.0 at the earliest. Only when an image will be
  # built — a run that builds nothing consumes no version. On a push / manual run
  # the tag is pushed right away, which reserves the number (a concurrent run that
  # computed the same one fails its push instead of publishing a duplicate); a PR
  # build gets `<next>-pr.<number>` and tags nothing. The version rides into every
  # image built below, as an image tag and baked into the build (shown at the
  # bottom of the Settings dashboard). Releases are declared by hand: push a tag
  # such as v1.0.0 and the following builds continue from it.
  version:
    needs: [test, changes]
    if: >-
      needs.changes.outputs.core == 'true' || needs.changes.outputs.core_front == 'true' ||
      needs.changes.outputs.pdf_service == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: eerp-version
      cancel-in-progress: false
    outputs:
      version: ${{ steps.next.outputs.version }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: compute the version
        id: next
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          git fetch --tags --force
          version="$(.github/scripts/next-version.sh)"
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            version="$version-pr.$PR_NUMBER"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Build version: $version" >> "$GITHUB_STEP_SUMMARY"
      - name: tag the commit
        if: github.event_name != 'pull_request'
        run: |
          git tag "v${{ steps.next.outputs.version }}" "$GITHUB_SHA"
          git push origin "v${{ steps.next.outputs.version }}"

  # 2a. Backend image — only when core/ changed (or a manual dispatch).
  build-core:
    needs: [test, changes, version]
    if: needs.changes.outputs.core == 'true' || github.event_name == 'workflow_dispatch'
    uses: ./.github/workflows/build-core.yml
    with:
      image_tag: ${{ inputs.image_tag || 'latest' }}
      environment: ${{ inputs.environment || 'build' }}
      version: ${{ needs.version.outputs.version }}
    secrets: inherit

  # 2b. Frontend image — only when core-front (or a module it bundles) changed.
  build-core-front:
    needs: [test, changes, version]
    if: needs.changes.outputs.core_front == 'true' || github.event_name == 'workflow_dispatch'
    uses: ./.github/workflows/build-core-front.yml
    with:
      image_tag: ${{ inputs.image_tag || 'latest' }}
      environment: ${{ inputs.environment || 'build' }}
      version: ${{ needs.version.outputs.version }}
    secrets: inherit

  # 2c. PDF worker image — only when tools/pdf-service/ changed.
  build-pdf-service:
    needs: [test, changes, version]
    if: needs.changes.outputs.pdf_service == 'true' || github.event_name == 'workflow_dispatch'
    uses: ./.github/workflows/build-pdf-service.yml
    with:
      image_tag: ${{ inputs.image_tag || 'latest' }}
      environment: ${{ inputs.environment || 'build' }}
      version: ${{ needs.version.outputs.version }}
    secrets: inherit
