name: Test & Build

# Top-level pipeline: run the test + coverage checks, then (only if they pass)
# build and publish whichever service image(s) actually changed to ghcr.io —
# each image only rebuilds when the code it's built FROM changed since the last
# push (the `changes` job below), so an unrelated change never produces a
# redundant, identical image.
#
# The services are listed in .github/services.json — adding a service (and its
# image, and its version in Settings) is one entry there:
#   {"name": "...", "image": "eerp-...", "dockerfile": "path/Dockerfile", "paths": ["path/**"]}
# `paths` are the files the image is built from (dorny/paths-filter globs).
#
# Pieces:
#   - test-check.yml   (Go + frontend tests and coverage — always runs)
#   - `version` below  (numbers the build: 0.101.0, 0.102.0, … — see its comment)
#   - build-image.yml  (one image -> ghcr, called once per changed service)
# `workflow_dispatch` always builds every service regardless of what changed —
# an explicit manual trigger is itself the "I want an image" signal.
on:
  push:
    branches: [main, dev]
  pull_request:
    types: [opened, edited, synchronize, reopened]
  workflow_dispatch:
    inputs:
      image_tag:
        description: "Tag applied to the published images"
        required: false
        type: string
        default: latest
      environment:
        description: "GitHub Environment whose variables/secrets back the build"
        required: false
        type: string
        default: build

permissions:
  contents: read
  packages: write

jobs:
  # 0. Which service image(s) need rebuilding — compares against the base of the
  # push/PR. The paths-filter filters are generated from services.json (one per
  # service, named after it), and `services` is the matching services.json
  # entries as a JSON array — the build matrix. dorny/paths-filter resolves the
  # base via the GitHub API only for `pull_request` events; a `push` needs real
  # local history, hence the full checkout (fetch-depth: 0).
  changes:
    runs-on: ubuntu-latest
    outputs:
      services: ${{ steps.select.outputs.services }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: filters from services.json
        id: gen
        run: |
          {
            echo 'filters<<EOF'
            jq -r '.[] | "\(.name):", (.paths[] | "  - \u0027\(.)\u0027")' .github/services.json
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: ${{ steps.gen.outputs.filters }}
      - name: changed services
        id: select
        env:
          CHANGED: ${{ steps.filter.outputs.changes }}
          ALL: ${{ github.event_name == 'workflow_dispatch' }}
        run: |
          services="$(jq -c --argjson changed "${CHANGED:-[]}" --arg all "$ALL" \
            '[.[] | select($all == "true" or (.name as $n | $changed | index($n)))]' .github/services.json)"
          echo "services=$services" >> "$GITHUB_OUTPUT"
          echo "Services to build: $services" >> "$GITHUB_STEP_SUMMARY"

  # 1. Gate: reuse the exact same checks PRs run.
  test:
    uses: ./.github/workflows/test-check.yml

  # 2. Version of this build (.github/scripts/next-version.sh): the latest vX.Y.Z
  # tag with its minor bumped, 0.101.0 at the earliest. Only when an image will be
  # built — a run that builds nothing consumes no version. On a push / manual run
  # the tag is pushed right away, which reserves the number (a concurrent run that
  # computed the same one fails its push instead of publishing a duplicate); a PR
  # build gets `<next>-pr.<number>` and tags nothing. Every image built below
  # carries it, as an image tag and stamped inside (each service reports it, and
  # Settings lists them all). Releases are declared by hand: push a tag such as
  # v1.0.0 and the following builds continue from it.
  version:
    needs: [test, changes]
    if: needs.changes.outputs.services != '[]'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: eerp-version
      cancel-in-progress: false
    outputs:
      version: ${{ steps.next.outputs.version }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: compute the version
        id: next
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          git fetch --tags --force
          version="$(.github/scripts/next-version.sh)"
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            version="$version-pr.$PR_NUMBER"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Build version: $version" >> "$GITHUB_STEP_SUMMARY"
      - name: tag the commit
        if: github.event_name != 'pull_request'
        run: |
          git tag "v${{ steps.next.outputs.version }}" "$GITHUB_SHA"
          git push origin "v${{ steps.next.outputs.version }}"

  # 3. One image per changed service, all stamped with the same version.
  build:
    needs: [test, changes, version]
    if: needs.changes.outputs.services != '[]'
    strategy:
      fail-fast: false
      matrix:
        service: ${{ fromJSON(needs.changes.outputs.services) }}
    name: build (${{ matrix.service.name }})
    uses: ./.github/workflows/build-image.yml
    with:
      image: ${{ matrix.service.image }}
      dockerfile: ${{ matrix.service.dockerfile }}
      image_tag: ${{ inputs.image_tag || 'latest' }}
      environment: ${{ inputs.environment || 'build' }}
      version: ${{ needs.version.outputs.version }}
    secrets: inherit
