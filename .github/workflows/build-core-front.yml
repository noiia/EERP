name: Build core-front (frontend)

# Reusable workflow ONLY — invoked via
# `uses: ./.github/workflows/build-core-front.yml` (see test-build.yml).
#
# It builds the Next.js frontend Docker image (core-front/Dockerfile) and publishes
# it to the GitHub Container Registry (ghcr.io). The build context is the repo root
# so the frontend can discover the external module views (see core-front/Dockerfile).
on:
  workflow_call:
    inputs:
      # Variable handed in through the call: the tag applied to the published image.
      image_tag:
        description: "Tag applied to the published image (e.g. a version, sha, or 'latest')"
        required: false
        type: string
        default: latest
      # Selects the GitHub deployment Environment whose variables/secrets back the
      # build (configured under Settings -> Environments).
      environment:
        description: "GitHub Environment whose variables/secrets to use for the build"
        required: false
        type: string
        default: build
    outputs:
      image:
        description: "Fully-qualified image reference(s) that were pushed"
        value: ${{ jobs.build.outputs.image }}

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    # Binds the GitHub Environment so its `vars` and `secrets` are in scope below.
    environment: ${{ inputs.environment }}
    outputs:
      image: ${{ steps.meta.outputs.tags }}
    steps:
      - uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/eerp-core-front
          tags: |
            type=raw,value=${{ inputs.image_tag }}
            type=sha

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: core-front/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # API_BASE is baked into the image at build time (the BFF -> Go backend
          # origin). It comes from the selected GitHub Environment's variables, with
          # a sane in-cluster default mirroring compose.yml.
          build-args: |
            API_BASE=${{ vars.API_BASE || 'http://backend:8080' }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
