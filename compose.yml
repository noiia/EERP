services:
  db:
    image: postgres:18
    container_name: db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: poc
    ports:
      - "5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  # S3-compatible object storage for the picture service (see infra/garage/README.md).
  # Starts empty: run `make garage-init` once to create the layout, dev key and bucket.
  garage:
    image: dxflrs/garage:v2.3.0
    container_name: garage
    environment:
      RUST_LOG: garage=warn,garage_api_admin=warn
    volumes:
      - ./infra/garage/garage.toml:/etc/garage.toml:ro
      - garage-meta:/var/lib/garage/meta
      - garage-data:/var/lib/garage/data
    expose:
      - "3900" # S3 API
    healthcheck:
      test: ["CMD", "/garage", "status"]
      interval: 5s
      timeout: 5s
      retries: 10

  core-back:
    container_name: backend
    build:
      context: .
      dockerfile: core/Dockerfile
    expose:
      - "8080"
    depends_on:
      db:
        condition: service_healthy

  core-front:
    container_name: frontend
    build:
      context: .
      dockerfile: core-front/Dockerfile
      args:
        API_BASE: "http://core-back:8080"
        API_VERSION: "1"
    environment:
      # The api-gateway terminates plain HTTP for now (no cert configured yet — see
      # nginx.conf). A Secure session cookie set over that connection would be silently
      # dropped by the browser, so login would succeed but never persist. Drop this once
      # TLS termination is added to the gateway.
      COOKIE_SECURE: "false"
    expose:
      - "3000"
    depends_on:
      db:
        condition: service_healthy
      core-back:
        condition: service_started

  api-gateway:
    image: nginx:1.31-alpine
    container_name: api-gateway
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M
    read_only: true
    tmpfs:
      - /var/cache/nginx
      - /run
      - /tmp
    volumes:
      - ./infra/nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "80:80"
      # - "443:443"
    depends_on:
      core-front:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/healthz || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  garage-meta:
  garage-data:
