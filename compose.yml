services:
  db:
    image: postgres:18
    container_name: db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: poc
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  # S3-compatible object storage for the picture service (see infra/garage/README.md).
  # Starts empty: run `make garage-init` once to create the layout, dev key and bucket.
  garage:
    image: dxflrs/garage:v2.3.0
    container_name: garage
    environment:
      RUST_LOG: garage=warn,garage_api_admin=warn
    volumes:
      - ./infra/garage/garage.toml:/etc/garage.toml:ro
      - garage-meta:/var/lib/garage/meta
      - garage-data:/var/lib/garage/data
    ports:
      # Host 3910 (3900 is commonly taken by other garage instances); in-network
      # clients still use garage:3900. Kept host-reachable (unlike core-back/core-front,
      # which the api-gateway now fronts exclusively) because host-native dev tooling —
      # `make run-back-tests`, a native `go run`/`go test` — talks to it directly via
      # eerp-config.json's s3_endpoint, same as db's fixed 5432 mapping above.
      - "3910:3900"
    healthcheck:
      test: ["CMD", "/garage", "status"]
      interval: 5s
      timeout: 5s
      retries: 10

  core-back:
    container_name: backend
    build:
      context: .
      dockerfile: core/Dockerfile
    expose:
      - "8080"
    depends_on:
      db:
        condition: service_healthy

  core-front:
    container_name: frontend
    build:
      context: .
      dockerfile: core-front/Dockerfile
      args:
        API_BASE: "http://core-back:8080"
        API_VERSION: "1"
    environment:
      # The api-gateway terminates plain HTTP for now (no cert configured yet — see
      # nginx.conf). A Secure session cookie set over that connection would be silently
      # dropped by the browser, so login would succeed but never persist. Drop this once
      # TLS termination is added to the gateway.
      COOKIE_SECURE: "false"
      # The standalone image always runs with NODE_ENV=production (next start requires
      # it), even for this local/dev compose stack — so the Settings > Developer seed
      # tool's NODE_ENV-derived guard would stay permanently disabled here otherwise.
      # This stack is dev-only, so opt back in explicitly. Never set this against a real
      # tenant deployment.
      ALLOW_DEMO_SEED: "true"
    expose:
      - "3000"
    depends_on:
      db:
        condition: service_healthy
      core-back:
        condition: service_started

  # Standalone PDF renderer (docs/adr/ADR-010, docs/roadmaps/pdf-reports.md). Behind a
  # profile so it doesn't load Chromium into every dev's `make run` before anything calls
  # it (Phase 3+) — start explicitly with `docker compose --profile pdf up -d pdf-service`.
  # No container_name: Phase 5's NATS worker mode makes this service horizontally
  # scalable (`docker compose --profile pdf up -d --scale pdf-service=N`) — a static
  # name would collide across replicas. NATS_URL is always set here; nats (below) is
  # in the same "pdf" profile, so it's always up alongside this. A single replica works
  # fine either way — the HTTP server (Phase 1-4) never goes away, NATS is additive.
  pdf-service:
    profiles: ["pdf"]
    build:
      context: .
      dockerfile: tools/pdf-service/Dockerfile
    environment:
      NATS_URL: nats://nats:4222
    expose:
      - "8090"
    depends_on:
      nats:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:8090/healthz"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Message broker fronting pdf-service replicas for horizontal scaling
  # (docs/roadmaps/pdf-reports.md Phase 5) — only used when core's own config sets
  # nats_url (unset by default: the HTTP path from Phase 1-4 keeps working with zero
  # extra infra). Default max_payload (1MB) is plenty for the reports measured so far
  # (10-60KB) — nats-server only takes max_payload from a config file, not a CLI flag,
  # so raising it later means mounting one, not just editing this command.
  nats:
    image: nats:2.10-alpine
    container_name: nats
    profiles: ["pdf"]
    expose:
      - "4222"
    healthcheck:
      test: ["CMD", "nc", "-z", "127.0.0.1", "4222"]
      interval: 5s
      timeout: 5s
      retries: 10

  api-gateway:
    image: nginx:1.31-alpine
    container_name: api-gateway
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M
    read_only: true
    tmpfs:
      - /var/cache/nginx
      - /run
      - /tmp
    volumes:
      - ./infra/nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "80:80"
      # - "443:443"
    depends_on:
      core-front:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/healthz || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  garage-meta:
  garage-data:
